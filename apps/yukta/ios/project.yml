name: Yukta

options:
  # Placeholder: a bundle id is permanent once registered with Apple. Decide the
  # store name and prefix first (docs/yukta/strategy/product-blueprint.md).
  bundleIdPrefix: com.alleviatelab
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "26.0"
  createIntermediateGroups: true
  groupSortPosition: top
  developmentLanguage: en

packages:
  # The scoring engine. A local package with NO dependencies, so `swift test`
  # runs natively (and on Linux CI) without a simulator, and domain code can't
  # reach for SwiftUI or HealthKit. Same pattern as PensarKit in nomadapps.
  YuktaKit:
    path: YuktaKit

settings:
  base:
    SWIFT_VERSION: "5.9"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    ENABLE_PREVIEWS: YES
    TARGETED_DEVICE_FAMILY: "1"   # iPhone first; iPad later
    MARKETING_VERSION: "0.1"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_EMIT_LOC_STRINGS: YES

targets:
  Yukta:
    type: application
    platform: iOS
    sources:
      - path: Yukta
        excludes:
          - "**/.DS_Store"
          - "**/.claude"
    configFiles:
      Debug: Configs/Debug.xcconfig
      Release: Configs/Release.xcconfig
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.alleviatelab.yukta
        # DEVELOPMENT_TEAM is never committed (public repo). It comes from the
        # gitignored Configs/Debug.xcconfig and Release.xcconfig.
        CODE_SIGN_STYLE: Automatic
        INFOPLIST_FILE: Yukta/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_ENTITLEMENTS: Yukta/Yukta.entitlements
      configs:
        Debug:
          # Debug builds install beside the store app instead of replacing it.
          PRODUCT_BUNDLE_IDENTIFIER: com.alleviatelab.yukta.local
          APP_DISPLAY_NAME: Yukta Local
        Release:
          APP_DISPLAY_NAME: Yukta
          DEBUG_INFORMATION_FORMAT: dwarf-with-dsym
    dependencies:
      - package: YuktaKit
        product: YuktaKit

schemes:
  Yukta:
    build:
      targets:
        Yukta: all
    run:
      config: Debug
    archive:
      config: Release
